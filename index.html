<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Очистка стены VK</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f2f3f5; color: #1d1d1f; }
    main { max-width: 560px; margin: 0 auto; padding: 28px 18px 44px; }
    .card { background: #fff; border-radius: 14px; padding: 22px; box-shadow: 0 2px 12px #0000000d; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { line-height: 1.45; color: #555; }
    label { display: block; margin: 22px 0 8px; font-weight: 600; }
    input, button { box-sizing: border-box; width: 100%; font: inherit; border-radius: 9px; }
    input { padding: 12px; border: 1px solid #d3d9de; }
    button { border: 0; padding: 12px 14px; margin-top: 12px; background: #2688eb; color: #fff; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .danger { background: #e64646; }
    .notice { margin-top: 18px; padding: 12px; background: #fff3cd; border-radius: 9px; color: #624d00; }
    .status { margin-top: 18px; min-height: 24px; white-space: pre-wrap; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>Очистка стены сообщества</h1>
      <p>Инструмент удаляет только записи со стены. Фото, видео, комментарии, товары и обсуждения не затрагиваются.</p>

      <label for="groupId">ID сообщества</label>
      <input id="groupId" inputmode="numeric" value="227205617" aria-describedby="hint" />
      <p id="hint">Для ссылки <code>vk.ru/club227205617</code> укажите <code>227205617</code>.</p>

      <button id="checkButton">Проверить количество постов</button>
      <div id="result" class="status" role="status"></div>

      <div id="deletePanel" class="hidden">
        <div class="notice">Удалённые записи нельзя восстановить. Проверьте ID сообщества перед подтверждением.</div>
        <button id="deleteButton" class="danger">Удалить все найденные посты</button>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <script>
    (() => {
      const APP_ID = 54762487;
      const API_VERSION = "5.199";
      const groupIdInput = document.getElementById("groupId");
      const checkButton = document.getElementById("checkButton");
      const deleteButton = document.getElementById("deleteButton");
      const deletePanel = document.getElementById("deletePanel");
      const result = document.getElementById("result");
      let accessToken = null;
      let posts = [];

      const setStatus = (message) => { result.textContent = message; };
      const validGroupId = () => /^\d+$/.test(groupIdInput.value.trim());

      async function getToken() {
        if (accessToken) return accessToken;
        const response = await vkBridge.send("VKWebAppGetAuthToken", {
          app_id: APP_ID,
          scope: "wall,groups"
        });
        accessToken = response.access_token;
        return accessToken;
      }

      async function callApi(method, params) {
        const token = await getToken();
        const query = new URLSearchParams({ ...params, access_token: token, v: API_VERSION });
        const response = await fetch(`https://api.vk.com/method/${method}?${query}`);
        const data = await response.json();
        if (data.error) throw new Error(data.error.error_msg || "Ошибка VK API");
        return data.response;
      }

      async function loadPosts() {
        if (!validGroupId()) throw new Error("Введите числовой ID сообщества.");
        const ownerId = `-${groupIdInput.value.trim()}`;
        const allPosts = [];
        let offset = 0;
        while (true) {
          const page = await callApi("wall.get", { owner_id: ownerId, count: "100", offset: String(offset) });
          allPosts.push(...page.items);
          offset += page.items.length;
          if (page.items.length === 0 || offset >= page.count) break;
        }
        return allPosts;
      }

      checkButton.addEventListener("click", async () => {
        deletePanel.classList.add("hidden");
        posts = [];
        checkButton.disabled = true;
        try {
          setStatus("Запрашиваю доступ и считаю посты…");
          posts = await loadPosts();
          if (posts.length === 0) {
            setStatus("На стене нет доступных для удаления постов.");
          } else {
            setStatus(`Найдено постов: ${posts.length}.`);
            deletePanel.classList.remove("hidden");
          }
        } catch (error) {
          setStatus(`Не удалось проверить стену: ${error.message}`);
        } finally {
          checkButton.disabled = false;
        }
      });

      deleteButton.addEventListener("click", async () => {
        const groupId = groupIdInput.value.trim();
        const accepted = window.confirm(`Удалить ${posts.length} постов со стены сообщества club${groupId}? Это действие нельзя отменить.`);
        if (!accepted) return;
        deleteButton.disabled = true;
        checkButton.disabled = true;
        let deleted = 0;
        try {
          for (const post of posts) {
            await callApi("wall.delete", { owner_id: `-${groupId}`, post_id: String(post.id) });
            deleted += 1;
            setStatus(`Удалено ${deleted} из ${posts.length} постов…`);
            await new Promise(resolve => setTimeout(resolve, 350));
          }
          setStatus(`Готово: удалено ${deleted} постов.`);
          deletePanel.classList.add("hidden");
          posts = [];
        } catch (error) {
          setStatus(`Остановка после ${deleted} из ${posts.length}: ${error.message}\nПовторная проверка покажет оставшиеся посты.`);
        } finally {
          deleteButton.disabled = false;
          checkButton.disabled = false;
        }
      });

      vkBridge.send("VKWebAppInit").catch(() => {
        setStatus("Откройте страницу внутри вашего мини-приложения VK.");
      });
    })();
  </script>
</body>
</html>
